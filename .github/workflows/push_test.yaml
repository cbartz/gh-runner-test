name: Test ScaleSet Runner
on:
  push:

jobs:
  hello:
    runs-on: my-scaleset # adjust to match your -name/-labels
    steps:
      - run: |
          echo "Hello from ScaleSet runner!"
          echo "Runner: $RUNNER_NAME"
          echo "Host: $(hostname)"

  parallel-test:
    runs-on: my-scaleset
    strategy:
      max-parallel: 2
      matrix:
        index: [1, 2, 3]
    steps:
      - run: |
          echo "Matrix job ${{ matrix.index }}"
          sleep 10