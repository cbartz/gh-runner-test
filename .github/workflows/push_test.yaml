name: Test ScaleSet Runner
on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: [self-hosted, my-scaleset]  # adjust to match your -name/-labels
    steps:
      - run: |
          echo "Hello from ScaleSet runner!"
          echo "Runner: $RUNNER_NAME"
          echo "Host: $(hostname)"

  parallel-test:
    runs-on: [self-hosted, my-scaleset]
    strategy:
      matrix:
        index: [1, 2, 3]
    steps:
      - run: |
          echo "Matrix job ${{ matrix.index }}"
          sleep 10